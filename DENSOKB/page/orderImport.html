<html>

    <title>订单导入</title>
    <meta charset="utf-8" />
    <link type="text/css" rel="Stylesheet" href="/Scripts/extjs/ext-theme-neptune/resources/ext-theme-neptune-all.css" />

    <script type="text/javascript" src="/Scripts/extjs/jquery-1.2.1.min.js"></script>
    <script type="text/javascript" src="/Scripts/extjs/ext-all.js"></script>
    <script type="text/javascript" src="/Scripts/extjs/ext-locale/build/ext-locale-zh_CN.js"></script>
    <link rel="stylesheet" href="/build/packages/font-awesome/resources/font-awesome-all.css">
    <script type="text/javascript" src="/Scripts/js/login.js"></script>

<body id="printform">

    <div id="toolbar" style="height:150px"></div>
    <div style="width:500px;height:500px">
        <div id="tableData" style="height: calc(100% - 350px); ">

        </div>
    </div>

</html>
<script language="JavaScript">
    var fullUrl = window.location.origin;
    Ext.require([
        "Ext.tip.QuickTipManager",
        "Ext.menu.*",
        "Ext.form.field.ComboBox",
        "Ext.form.field.Text",
        "Ext.layout.container.Table",
        "Ext.container.ButtonGroup",
        "Ext.Img",
        "Ext.form.*",
        "Ext.grid.filters.Filters",
    ]);
    Ext.onReady(function () {
        var token = localStorage.getItem('token');
        var searchPanel = Ext.create('Ext.form.Panel', {
            width: "100%",
            collapsible: true,
            overlapHeader: false,
            collapsed: true,//默认折叠
            collapseMode: 'header',
            titleCollapse: true,//隐藏title区域
            hideCollapseTool: false,//隐藏按钮
            split: true,
            collapseDirection: 'top',
            animCollapse: false,
            region: 'north',
            itmeID: 'searchid',
            autoHeight: true,
            renderTo: "toolbar",
            layout: "form", // 整个大的表单是form布局
            labelAlign: "left",
            bodyStyle: 'padding:0 5 5 5',
            border: 0,
            items: [{ // 行1
                layout: "column", // 从左往右的布局
                border: 0,
                items: [{
                    border: 0,
                    columnWidth: .18, // 该列有整行中所占百分比
                    layout: "form", // 从上往下的布局
                    items: [
                        {
                            xtype: "combobox",
                            id: "cusname",
                            fieldLabel: "客户",
                            displayField: "name", //展示值
                            valueField: "value",
                            labelWidth: 60,
                            width: 140,
                            fuzzySelect: true,
                            queryMode: "local", //取本地数据
                            multiSelect: false, //支持多选
                            hidden: false, //是否隐藏,
                            editable: false,
                            allowBlank: true, //允许value为空
                            msgTarget: "qtip",
                            store: {
                                fields: ["name", "value"],
                                data: [
                                    { name: "长春", value: 'FTCE' },
                                    { name: "一汽发动机", value: 'FTET' }
                                ],
                            },
                        }]
                },
                {
                    border: 0,
                    columnWidth: .18,
                    layout: "form",
                    items: [{
                        xtype: "textfield",
                        id: "orderCode",
                        fieldLabel: "订单号",
                    }
                    ]
                },
                {
                    border: 0,
                    columnWidth: .19,
                    layout: "form",
                    items: [{
                        xtype: "textfield",
                        id: "orderBatch",
                        fieldLabel: "订单便次",
                    }]
                }, {
                    border: 0,
                    columnWidth: .20,
                    layout: "form",
                    items: [{
                        xtype: "textfield",
                        id: "operator",
                        fieldLabel: "传票作成者",
                    }]
                },{
                        border: 0,
                        columnWidth: .20,
                        layout: "form",
                        items: [{
                            xtype: "combo",  // 使用combo代替textfield
                            id: "status",
                            fieldLabel: "解析状态",
                            store: new Ext.data.ArrayStore({
                                fields: ['value', 'text'],  // 设置存储数据的字段
                                data: [
                                    ['1', '解析中'],
                                    ['2', '成功'],
                                    ['3', '失败'],
                                    ['4', '重新解析']
                                ]
                            }),
                            displayField: 'text',  // 显示的文本
                            valueField: 'value',  // 存储的值
                            mode: 'local',  // 本地数据
                            triggerAction: 'all',  // 点击下拉框时展开所有选项
                            forceSelection: true,  // 强制选择下拉项
                            editable: false,  // 禁止手动输入
                            blankText: '请选择解析状态',  // 没有选择时的提示文本
                            emptyText: '请选择',  // 显示的默认空文本
                            anchor: '100%'  // 设置宽度填充父容器
                        }]
                    }
                ]
            }, { // 行2
                layout: "column",
                border: 0,
                items: [{
                    border: 0,
                    columnWidth: .19,
                    layout: "form",
                    items: [{
                        xtype: 'datefield',
                        id: "importStart",
                        format: 'Y-m-d',
                        editable: false,
                        fieldLabel: "导入时间",
                    }]
                }, {
                    border: 0,
                    columnWidth: .19,
                    layout: "form",
                    items: [{
                        xtype: 'datefield',
                        id: "importEnd",
                        format: 'Y-m-d',
                        editable: false,
                        labelSeparator: '',
                        fieldLabel: "至",
                    }]
                }, {
                    border: 0,
                    columnWidth: .19,
                    layout: "form",
                    items: [{
                        xtype: 'datefield',
                        id: "sendStart",
                        format: 'Y-m-d',
                        editable: false,
                        fieldLabel: "发货日期",
                    }]
                }, {
                    border: 0,
                    columnWidth: .19,
                    layout: "form",
                    items: [{
                        xtype: 'datefield',
                        id: "sendEnd",
                        format: 'Y-m-d',
                        editable: false,
                        labelSeparator: '',
                        fieldLabel: "至",
                    }]
                },
                    {
                        border: 0,
                        columnWidth: .20,
                        layout: "form",
                        items: [{
                            xtype: "textfield",
                            id: "downloadcount",
                            fieldLabel: "下载次数",
                        }]
                    }
                ]
            }],
            buttonAlign: "center",
            buttons: [{
                text: '查询',
                formBind: true, //only enabled once the form is valid
                disabled: true,
                itemId: 'searchBtn',
                handler: function () {
                    var form = this.up('form').getForm();
                    if (form.isValid()) {
                        console.log("importStart", Ext.getCmp("importStart").getValue())
                        var queryJson = {
                            "cuscode": Ext.getCmp("cusname").getValue(),
                            "ordercode": Ext.getCmp("orderCode").getValue(),
                            "orderbin": Ext.getCmp("orderBatch").getValue(),
                            "createperson": Ext.getCmp("operator").getValue(),// 传票做成者 operator
                            "status": Ext.getCmp("status").getValue(),
                            "importstart": Ext.Date.format(Ext.getCmp("importStart").getValue(), 'Y-m-d'),// 导入开始时间 importStart  处理时区
                            "importend": Ext.Date.format(Ext.getCmp("importEnd").getValue(), 'Y-m-d'),// 导入结束时间 importEnd
                            "sendstart": Ext.Date.format(Ext.getCmp("sendStart").getValue(), 'Y-m-d'),// 发货开始时间 sendStart
                            "sendend": Ext.Date.format(Ext.getCmp("sendEnd").getValue(), 'Y-m-d'),// 发货结束时间 sendEnd
                            "downloadcount": Ext.getCmp("downloadcount").getValue(),// 下载次数
                            
                        };
                        store.currentPage = 1;
                        store.proxy.extraParams = {
                            queryJson: JSON.stringify(queryJson)
                        };
                        store.load();
                    }
                }
            }, {
                text: '重置',
                handler: function () {
                    this.up('form').getForm().reset();
                }
            },
            {
                text: '下载',
                handler: function () {
                    var cuscode = Ext.getCmp('cusname').getValue();
                    var startdate = Ext.Date.format(Ext.getCmp("sendStart").getValue(), 'Y-m-d');
                    var enddate = Ext.Date.format(Ext.getCmp("sendEnd").getValue(), 'Y-m-d');
                    if (!cuscode) {
                        Ext.Msg.alert('提示', '客户类别不能为空');
                        return;
                    }

                    if (!startdate) {
                        Ext.Msg.alert('提示', '发货开始日期不能为空');
                        return;
                    }

                    if (!enddate) {
                        Ext.Msg.alert('提示', '发货截止日期不能为空');
                        return;
                    }
                    

                    var url = '/ExportRpt/getRpt?cuscode=' + encodeURIComponent(cuscode) +
                        '&startdate=' + encodeURIComponent(startdate) +
                        '&enddate=' + encodeURIComponent(enddate);
                    var link = document.createElement('a');
                    link.href = url;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }

            }]
        });
        // 定义数据模型
        Ext.define('OrderModel', {
            extend: 'Ext.data.Model',
            fields: [
                { name: 'importTime', type: 'date', dateFormat: 'Y-m-d H:i:s' },
                'customerName',
                'customerCode',
                'orderNumber',
                'orderSequence',
                { name: 'deliveryDate', type: 'date', dateFormat: 'Y-m-d' },
                'invoiceCreator',
                { name: 'createTime', type: 'date', dateFormat: 'Y-m-d H:i:s' }
            ]
        });

        // 创建数据存储
        var store = Ext.create('Ext.data.Store', {
            model: 'OrderModel',
            autoLoad: true,
            pageSize: 20,
            fields: ['inportdate', 'cusname', 'cuscode', 'ordercode', 'orderbin',
                'podate', 'createperson', 'createdate'],
            proxy: {
                type: 'ajax',
                url: fullUrl + '/orderImport/GetPageList',
                method: 'POST',  // 强制使用 POST
                actionMethods: {
                    read: 'POST'
                },
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                paramsAsJson: true,
                reader: {
                    type: 'json',
                    rootProperty: 'data',
                    totalProperty: 'total',
                    transformResponse: function (rawResponse) {
                        try {
                            // 手动解析 JSON 字符串
                            const response = Ext.decode(rawResponse);
                            return response;
                        } catch (e) {
                            return { success: false, total: 0, data: [] };
                        }
                    }
                },
                writer: {
                    type: 'json'
                },
                listeners: {
                    exception: function (proxy, response, operation) {
                        if (response.status == 401) {
                            parent.Ext.MessageBox.alert({
                                title: '警告',
                                message: '<div style="text-align:center;">请先登录账号</div>',
                                buttons: Ext.MessageBox.OK,
                                width: 100,
                                fn() {
                                    localStorage.removeItem('token');
                                    window.parent.location.href = "/login.html";
                                }
                            });
                        }
                    }
                }
                //extractResponseData: function (response) {
                //    console.log("response-------", response.status);
                //}
            }
        });

        Ext.tip.QuickTipManager.init(); // 初始化提示管理器
        // 创建Grid面板
        var grid = Ext.create('Ext.grid.Panel', {
            //renderTo: Ext.getBody(),
            store: store,
            id: 'tableGrid',
            width: '500px',
            height: '500',
            // forceFit: true,
            renderTo: 'tableData',
            region: 'center',
            selModel: Ext.create("Ext.selection.CheckboxModel", {
                injectCheckbox: 0, //checkbox位于哪一列，默认值为0
                mode: "multi", //multi,simple,single；默认为多选multi
                checkOnly: false, //如果值为true，则只用点击checkbox列才能选中此条记录
                allowDeselect: true, //如果值true，并且mode值为单选（single）时，可以通过点击checkbox取消对其的选择
                enableKeyNav: true,
            }),
            plugins: {
                ptype: 'gridfilters', // 必须添加的插件
                filtersText: '筛选',   // 筛选菜单显示文本
                showMenu: true        // 显示筛选菜单图标
            },

            columns: [
                {
                    text: '导入时间',
                    dataIndex: 'inportdate',
                    width: 150,
                    renderer: Ext.util.Format.dateRenderer('Y-m-d H:i:s'),
                    filter: {
                        type: 'date', // 日期类型筛选
                        dateFormat: 'Y-m-d H:i:s'
                    },

                },
                {
                    text: '解析状态', dataIndex: 'handlestate', width: 80,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    },
                    renderer: function (value) {
                        const map = {
                            '1': '解析中',
                            '2': '成功',
                            '3': '失败',
                            '4': '重新解析'
                        };
                        return map[value] || value;
                    }
                },
                {
                    text: '解析结果', dataIndex: 'handlemess', width: 250,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    },
                    renderer: function (v, meta) {
                        meta.tdAttr = 'data-qwidth=300 data-qtip="' + v + '"';
                        return v;
                    }
                },
                {
                    text: '客户', dataIndex: 'cusname', width: 120, editor: 'textfield',
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '客户代码', dataIndex: 'cuscode', width: 100,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '订单号', dataIndex: 'ordercode', width: 150,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '类型', dataIndex: 'redundancy2', width: 70,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '订单便次', dataIndex: 'orderbin', width: 80,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '发货日期',
                    dataIndex: 'podate',
                    width: 100,
                    renderer: Ext.util.Format.dateRenderer('Y-m-d'),
                    filter: {
                        type: 'date', // 日期类型筛选
                        dateFormat: 'Y-m-d H:i:s'
                    }
                },
                {
                    text: '传票作成者', dataIndex: 'createperson', width: 100,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '传票作成时刻',
                    dataIndex: 'createdate',
                    width: 150,
                    renderer: Ext.util.Format.dateRenderer('Y-m-d H:i:s'),
                    filter: {
                        type: 'date', // 日期类型筛选
                        dateFormat: 'Y-m-d H:i:s'
                    }
                },
                {
                    text: '确认表备注',
                    width: 100,
                    xtype: 'widgetcolumn',
                    onWidgetAttach: function (widget, record) {
                        widget.record = record;
                    },
                    widget: {
                        xtype: 'button',
                        text: '填写',
                        width: 60,
                        handler: function () {
                            var record = this.getWidgetRecord();

                            var win = Ext.create('Ext.window.Window', {
                                title: '填写确认表备注',
                                modal: true,
                                width: 600,
                                height: 400,
                                layout: 'fit',
                                items: [{
                                    xtype: 'form',
                                    bodyPadding: 10,
                                    items: [{
                                        xtype: 'textarea',
                                        name: 'confirmRemark',
                                        fieldLabel: '备注',
                                        labelAlign: 'top',
                                        value: '', // 初始留空，后面通过请求设置
                                        allowBlank: false,
                                        anchor: '100%',
                                        height: 300
                                    }]
                                }],
                                buttons: [{
                                    text: '确定',
                                    handler: function () {
                                        var form = win.down('form').getForm();
                                        if (form.isValid()) {
                                            var newRemark = form.findField('confirmRemark').getValue();
                                            record.set('confirmRemark', newRemark);

                                            Ext.Ajax.request({
                                                url: '/orderimport/SaveConfirmRemark',
                                                method: 'POST',
                                                jsonData: {
                                                    id: record.get('id'),
                                                    confirmRemark: newRemark,
                                                    type: record.get('cuscode'),
                                                    ordercode: record.get('ordercode')
                                                },
                                                success: function () {
                                                    Ext.Msg.alert('成功', '备注已保存');
                                                    win.close();
                                                },
                                                failure: function () {
                                                    Ext.Msg.alert('错误', '备注保存失败');
                                                }
                                            });
                                        }
                                    }
                                }, {
                                    text: '取消',
                                    handler: function () {
                                        win.close();
                                    }
                                }]
                            });

                            win.show();

                            // 发请求加载确认表备注
                            Ext.Ajax.request({
                                url: '/orderimport/GetConfirmRemark', 
                                method: 'GET',
                                params: {
                                    id: record.get('id'),
                                    type: record.get('cuscode'),
                                    ordercode: record.get('ordercode')
                                },
                                success: function (response) {
                                    var resp = Ext.decode(response.responseText);
                                    var remark = resp.info || '';  // 从 info 读取备注
                                    var form = win.down('form').getForm();
                                    form.findField('confirmRemark').setValue(remark);
                                },

                                failure: function () {
                                    Ext.Msg.alert('错误', '无法加载备注信息');
                                }
                            });
                        }

                    }
                },

                {
                    text: '受领书',
                    width: 60,
                    xtype: 'widgetcolumn',
                    onWidgetAttach: function (widget, record) {
                        //将行记录注入到图片组件
                        widget.record = record.getWidgetRecord().getData();
                    },
                    widget: {
                        xtype: 'image',
                        src: '../images/orderImport/book.png', // 图片路径
                        width: 20,
                        height: 20,
                        style: { cursor: 'pointer', display: 'block', margin: '0 auto' }, // 添加指针样式
                        listeners: {
                            element: 'el',
                            click: function () {

                                //showRadioWindow(this.component.getWidgetRecord().data);
                                // 直接访问注入的记录  id 类型  文件名称
                                downloadFile2(this.component.getWidgetRecord().data.id, 'sls', '受领书',"","");
                            }
                        }
                    }
                },
                {
                    text: '托标签',
                    width: 60,
                    xtype: 'widgetcolumn',
                    onWidgetAttach: function (widget, record) {
                        //将行记录注入到图片组件
                        widget.record = record.getWidgetRecord().getData();
                    },
                    widget: {
                        xtype: 'image',
                        src: '../images/orderImport/label.png', // 图片路径
                        width: 20,
                        height: 20,
                        style: { cursor: 'pointer', display: 'block', margin: '0 auto' }, // 添加指针样式
                        listeners: {
                            element: 'el',
                            click: function () {
                                // 直接访问注入的记录
                                //onDownload('pallet', this.component.getWidgetRecord().data);
                                downloadFile2(this.component.getWidgetRecord().data.id, 'MDcode', '托标签',"","");
                            }
                        }
                    }
                },
                {
                    text: '箱标签',
                    width: 60,
                    xtype: 'widgetcolumn',
                    onWidgetAttach: function (widget, record) {
                        //将行记录注入到图片组件
                        widget.record = record.getWidgetRecord().getData();
                    },
                    widget: {
                        xtype: 'image',
                        src: '../images/orderImport/box.png', // 图片路径
                        width: 20,
                        height: 20,
                        style: { cursor: 'pointer', display: 'block', margin: '0 auto' }, // 添加指针样式
                        listeners: {
                            element: 'el',
                            click: function () {
                                // 直接访问注入的记录
                                // onDownload('pallet', this.component.getWidgetRecord().data);
                                showRadioWindow(this.component.getWidgetRecord().data);
                            }
                        }
                    }
                },
                {
                    text: '确认单',
                    width: 60,
                    xtype: 'widgetcolumn',
                    onWidgetAttach: function (widget, record) {
                        //将行记录注入到图片组件
                        widget.record = record.getWidgetRecord().getData();
                    },
                    widget: {
                        xtype: 'image',
                        src: '../images/orderImport/confirm.png', // 图片路径
                        width: 20,
                        height: 20,
                        style: { cursor: 'pointer', display: 'block', margin: '0 auto' }, // 添加指针样式
                        listeners: {
                            element: 'el',
                            click: function () {
                                // 直接访问注入的记录
                                //onDownload('pallet', this.component.getWidgetRecord().data);
                                downloadFile2(this.component.getWidgetRecord().data.id,
                                    'confirm', 
                                    '确认单',
                                    this.component.getWidgetRecord().data.cuscode,
                                    this.component.getWidgetRecord().data.ordercode
                                );
                            }
                        }
                    }
                },
                {
                    text: '下载次数', dataIndex: 'downloadcount', width: 70,
                    renderer: function (value) {
                        return value == null || value === '' ? 0 : value;
                    }
                },
                {
                    text: '文件名称', dataIndex: 'redundancy3', width: 180,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },

                {
                    text: '解析开始时间', dataIndex: 'handlebegin', width: 180,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '解析结束时间', dataIndex: 'handleend', width: 180,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '时长', dataIndex: 'handletime', width: 180,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
                {
                    text: '计划到货日期', dataIndex: 'redundancy7', width: 180,
                    filter: {
                        type: 'string', // 字符串类型筛选
                        placeholder: '输入...'
                    }
                },
            ],
            dockedItems: [{
                xtype: 'pagingtoolbar',
                store: store,
                dock: 'bottom',
                displayInfo: true
            }],
            tbar: [{
                text: '上传文件',
                handler: function () {
                    //showUploadOptionsWindow();
                    initUploadWin();

                }
            },
                //{
                //    text: '物流计划上传',
                //    handler: function(){
                //        initUploadWin();
                //    }
                //},

            {
                text: '标签下载',
                handler: function () {
                    var form = Ext.create('Ext.form.Panel', {
                        border: false,
                       // width: '100%',
                        width: 500,   // 设置宽度
                        height: 300,   // 设置高度
                        bodyPadding: 10,
                        items: [

        //适用于 GET 请求
        function downloadFile1(type) {
            // 构建 URL 参数
            var params = {
                type: type
            };
            var query = Object.keys(params)
                .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
                .join('&');

            // 创建临时链接并触发点击
            var url = fullUrl + '/DownloadFile/DownloadFile?' + query; // 替换为你的接口地址
            var link = document.createElement('a');
            link.href = url;
            link.download = 'filename.ext'; // 可选，但需后台支持文件名
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
        //适用于 POST 请求
        function downloadFile2(mid, type, filename, cuscode, ordercode) {
       
            var conn = new Ext.data.Connection();
            conn.request({
                url: fullUrl + '/DownloadFile/DownloadFileZipNew',
                method: 'POST',
                jsonData: { type: type, id: mid, zipfilename: filename, cuscode: cuscode, ordercode: ordercode },
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                binary: true, // 关键：告诉 ExtJS 处理二进制数据
                timeout: 300000,
                success: function (response) {
                    console.log("responsesuccess", response.message)
                    DownloadResponse(response);

                    //if (response.statusText == "ok") {
                    //    DownloadResponse(response);
                    //} else {
                    //    Ext.Msg.alert('错误', decodeURIComponent(response.message));
                    //}
                },
                failure: function (response) {
                    console.log("responsefailure", response)
                    mask.hide();
                    Ext.Msg.alert('错误', response.responseText || "请求失败");
                }
            });
        }

                timeout: 300000,
                success: function (response) {
                    mask.hide();
                    console.log(response);
                },
                failure: function (response) {
                    mask.hide();
                    Ext.Msg.alert('错误', '文件下载失败');
                }
            });
        }
        function DownloadResponse(response) {
            var contentDisposition = response.getResponseHeader('Content-Disposition');
            // 2. 正则提取编码后的文件名
            var matches = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
            var encodedFileName = matches[1].replace(/['"]/g, '');
            // 3. URL解码（兼容现代浏览器自动解码的情况）
            var decodedFileName = decodeURIComponent(encodedFileName);
            // 4. 处理特殊字符（如空格被编码为%20）
            decodedFileName = decodedFileName.replace(/%20/g, ' ');
            var blob = new Blob([response.responseBytes], { type: 'application/octet-stream' });
            var link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = decodedFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            mask.hide();
        }
    });

</script>
